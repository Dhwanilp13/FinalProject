<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Final Project by Dhwanil Patel</title>
	<!--[if IE]>
		<script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
	<![endif]-->
    <link rel="stylesheet" type="text/css" href="css/final.css">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script type="text/javascript" src="js/final.js"></script>
</head>

<body id="main">

	<h1>Antibiotic Resistance Gene Finder by Dhwanil Patel</h1>
    
    <form name="gene_finder" id="gene_finder">
        <!-- Main sequence input -->
        <label for="sequence">Enter your bacterial DNA sequence (sequence only):</label><br>
        <textarea name="sequence" id="sequence" rows="15" cols="60"
               placeholder="Enter DNA sequence here" required></textarea><br><br>

        <!-- Optional gene search with autocomplete -->
        <label for="search_term">Use the next field only if you would like to check for specific genes. Otherwise, you can leave it blank.</label><br><br>
        <label for="search_term">Enter an antibiotic resistance gene (optional):</label><br>
        <input name="search_term" id="search_term" type="text"
               placeholder="Search for specific gene"><br><br>

        <!-- Database selection -->
        <label for="source_db">Select a database to search in:</label><br>
        <select name="source_db" id="source_db" required>
            <option value="CARD">CARD</option>
            <option value="ResFinder">ResFinder</option>
            <option value="Both" selected>Both</option>
        </select><br><br>

        <input type="submit" id="submit" value="Search for Matches">
    </form>

    <section id="results" style="display: none;">
        <h2>Search Results</h2>
        <p>
            Found <span id="match_count">0</span> match(es) in the database
        </p>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Gene Name</th>
                <th>Drug Class</th>
                <th>Resistance Mechanism</th>
                <th>Source Database</th>
                <th>Identity %</th>
                <th>Location</th>
                <th>Gene Sequence</th>
            </tr>
            </thead>
            <tbody>
                <!-- This will be filled in by JavaScript when there are results -->
            </tbody>
        </table>
    </section>

    <!-- Loading indicator -->
    <div id="loading" style="display: none;">
        Analyzing your sequence...
    </div>
</body>

</html>
